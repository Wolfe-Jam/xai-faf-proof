<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xai-faf-proof — share card</title>
<meta name="description" content="1,399× faster type-filter on real AI memory corpora. Grok + Claude co-built receipts for .fafm / .fafb.">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #f5f5f5;
    --muted: #888;
    --slow: #6b7280;
    --orange: #FF6B35;
    --cyan: #00D4D4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Card sized to 1200 × 630 (standard X / Twitter Cards aspect) */
  .card {
    width: 1200px;
    height: 630px;
    background: var(--bg);
    padding: 60px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  /* Subtle radial accent so the card doesn't look flat */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 35%, rgba(255, 107, 53, 0.05), transparent 60%);
    pointer-events: none;
  }

  .header {
    text-align: center;
    color: var(--muted);
    font-size: 18px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    z-index: 1;
  }
  .header .repo {
    color: var(--orange);
    font-weight: 700;
  }

  /* Three-column comparison */
  .compare {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 40px;
    flex: 1;
    padding: 20px 0;
    z-index: 1;
  }

  .lane {
    text-align: center;
  }
  .lane .icon {
    font-size: 110px;
    line-height: 1;
    display: block;
    margin-bottom: 18px;
  }
  .lane.slow .icon { filter: grayscale(0.5); opacity: 0.85; }
  .lane.fast .icon { filter: drop-shadow(0 4px 12px rgba(255, 107, 53, 0.5)); }

  .lane .label {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    font-family: "SF Mono", Menlo, monospace;
  }
  .lane.slow .label { color: var(--slow); }
  .lane.fast .label { color: var(--orange); }

  .lane .time {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 4px;
    font-family: "SF Mono", Menlo, monospace;
    color: var(--text);
  }
  .lane .sub {
    font-size: 16px;
    color: var(--muted);
    font-weight: 400;
  }

  /* The big speedup number in the middle */
  .speedup {
    text-align: center;
    padding: 0 30px;
  }
  .speedup .number {
    font-size: 96px;
    font-weight: 900;
    color: var(--orange);
    font-family: "SF Mono", Menlo, monospace;
    letter-spacing: -0.04em;
    line-height: 1;
    text-shadow: 0 4px 30px rgba(255, 107, 53, 0.4);
  }
  .speedup .label {
    font-size: 20px;
    color: var(--cyan);
    margin-top: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .footer {
    text-align: center;
    z-index: 1;
  }
  .footer .doctrine {
    font-size: 22px;
    color: var(--text);
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .footer .doctrine .orange { color: var(--orange); }
  .footer .url {
    font-size: 16px;
    color: var(--muted);
    font-family: "SF Mono", Menlo, monospace;
  }
</style>
</head>
<body>

<div class="card">

  <div class="header">
    <span class="repo">xai-faf-proof</span> &nbsp;·&nbsp; how we roll
  </div>

  <div class="compare">

    <div class="lane slow">
      <span class="icon">🐌</span>
      <div class="label">grep</div>
      <div class="time">169.77 ms</div>
      <div class="sub">scan every file, every query</div>
    </div>

    <div class="speedup">
      <div class="number">1,399×</div>
      <div class="label">faster</div>
    </div>

    <div class="lane fast">
      <span class="icon">🚀</span>
      <div class="label">.fafb</div>
      <div class="time">121 µs</div>
      <div class="sub">pre-indexed binary tier</div>
    </div>

  </div>

  <div class="footer">
    <div class="doctrine">
      <span class="orange">Prep once.</span> Query forever.
    </div>
    <div class="url">github.com/Wolfe-Jam/xai-faf-proof</div>
  </div>

</div>

</body>
</html>
